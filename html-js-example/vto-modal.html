<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VTO - Modal Integration</title>
  <link rel="stylesheet" href="drawer-styles.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 10px;
      padding-top: 0px;
      min-height: 100vh;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .header-nav {
      display: flex;
      gap: 20px;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1200px;
      padding: 10px 0;
    }

    .modal-nav {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      align-items: center;
      justify-content: center;
      z-index: 1002;
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .nav-button {
      background: none;
      border: none;
      color: #000;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 0;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .nav-button:hover {
      opacity: 0.6;
    }

    .nav-separator {
      width: 1px;
      height: 16px;
      background: #e0e0e0;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
    }

    .open-button {
      padding: 12px 24px;
      background: #fff;
      color: #000;
      border: 2px solid #000;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .open-button:hover {
      background: #000;
      color: #fff;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 1001;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      position: relative;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      transform: scale(0.9);
      transition: transform 0.3s;
      width: 1160px;
      height: 700px;
      display: flex;
      flex-direction: column;
    }

    .modal-overlay.open .modal-content {
      transform: scale(1);
    }

    .desktop-close-button {
      position: absolute;
      top: 8px;
      right: 12px;
      width: 24px;
      height: 24px;
      border: none;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .desktop-close-button:hover {
      background: rgba(255, 255, 255, 1);
    }

    .desktop-close-button:active {
      background: rgba(0, 0, 0, 0.1);
    }

    .mobile-header {
      display: none;
      align-items: center;
      justify-content: flex-end;
      height: 28px;
      background: white;
      padding: 0 8px;
      flex-shrink: 0;
    }

    .mobile-header .close-button {
      width: 24px;
      height: 24px;
      border: none;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .mobile-header .close-button:hover {
      background: rgba(0, 0, 0, 0.1);
    }

    #vto-iframe {
      border: none;
      width: 100%;
      height: 100%;
      display: block;
    }

    @media (max-width: 1200px) {
      .modal-content {
        width: 100%;
        height: 100dvh;
        border-radius: 0;
      }

      .desktop-close-button {
        display: none;
      }

      .mobile-header {
        display: flex;
      }

      #vto-iframe {
        height: calc(100dvh - 28px);
      }
    }
  </style>
</head>
<body>
  <nav class="header-nav">
    <a href="./index.html" class="nav-button" title="Back to Index">
      ← Back
    </a>
    <div class="nav-separator"></div>
    <button class="nav-button" onclick="toggleDrawer('guide')" title="Integration Guide">
      Guide
    </button>
  </nav>

  <div class="container">
    <button class="open-button" onclick="openVTO()">Open VTO</button>
  </div>

  <div id="modal" class="modal-overlay">
    <nav class="modal-nav">
      <button class="nav-button" onclick="toggleDrawer('events')" title="SDK Events & Actions">
        Events & Actions
      </button>
    </nav>
    <div class="modal-content">
      <button class="desktop-close-button" onclick="closeVTO()" aria-label="Close">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
      <div class="mobile-header">
        <button class="close-button" onclick="closeVTO()" aria-label="Close">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <iframe id="vto-iframe" allow="camera *;"></iframe>
    </div>
  </div>

  <!-- Drawer Container - Dynamically loaded -->
  <div id="drawer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@pulpoar/plugin-sdk@latest/dist/index.iife.js"></script>
  <script src="drawer-loader.js"></script>
  <script src="drawer-core.js"></script>
  <script src="vto-actions.js"></script>
  <script src="vto-events.js"></script>
  <script>
    const modal = document.getElementById('modal');
    const iframe = document.getElementById('vto-iframe');

    function openVTO() {
      iframe.src = 'https://plugin.pulpoar.com/vto/makeup-demo-1';
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeVTO() {
      modal.classList.remove('open');
      document.body.style.overflow = '';
    }

    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeVTO();
    });

    loadDrawers('vto').then(() => {
      subscribeToVTOEvents();
    });
  </script>
</body>
</html>
